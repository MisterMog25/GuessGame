<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    {% if messages %}
        {% for msg in messages %}
            <h3 style="color: red;">{{ msg }}</h3>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

    <footer>
        <p>&copy; 2025 Вікторина</p>
    </footer>
</body>
</html>
