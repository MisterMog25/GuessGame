<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Вікторина{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .content {
            flex: 1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh; /* зайняти всю висоту вікна */
            margin: 0;
            padding-top: 50px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        footer {
            color: black;
            padding: 20px 0;
            text-align: center;
            justify-content: flex-start;
        }
        footer a {
            color: grey;
            text-decoration: none;
        }
        footer a:hover {
            color: #fff;
        }
        .header-img {
            max-height: 100px;
            object-fit: cover;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'main_menu' %}"><img src="{% static 'quiz/img/logo.jpg' %}" alt="Quiz Header" class="header-img rounded shadow"></a>
    </div>

    <div class="container mt-3">
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="container content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Вікторина. Всі права захищені.</p>
            <p>
                <a href="#">Політика конфіденційності</a> |
                <a href="#">Контакти</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
